name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install
        run: npm ci
      - name: Build the page
        run: npx vite build --config vite.desktop.config.ts
      - name: Build the installer and the portable exe
        shell: pwsh
        run: ./scripts/build-release.ps1
      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Select-String -Path desktop/Cargo.toml -Pattern 'version = "([^"]+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          gh release create "v$version" dist/Vellum-Setup-$version.exe dist/Vellum-$version-portable.exe dist/SHA256SUMS.txt --title "Vellum $version" --notes-file dist/NOTES.md
